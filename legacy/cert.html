<!DOCTYPE html>

<head>

  <title>Kenneth Radin | Certificates</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Dosis:wght@100..900&family=Francois+One&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="cert.css" />

  <!-- Smooth scrolling -->
  <style>
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body>
  <!-- Internal Nav with Back Button -->
  <nav class="mini-nav">
    <div class="button-nav">
      <a href="index.html">
        <img src="pics/home.png" alt="Home Button" class="nav-button" />
      </a>
      <a href="about.html">
        <img src="pics/info.png" alt="About Button" class="nav-button" />
      </a>
      <a href="cert.html">
        <img src="pics/certificate.png" alt="Certificates Button" class="nav-button" />
      </a>
      <a href="tech-stack.html">
        <img src="pics/stack.png" alt="Tech Stack Button" class="nav-button" />
      </a>
      <a href="contact.html">
        <img src="pics/contact-mail.png" alt="Contact Button" class="nav-button" />
      </a>
    </div>
  </nav>

  <!-- Certificates Section -->
  <section class="certificates-section" id="certs">
    <h2>CERTIFICATES</h2>
    <div class="certificates-container">
      <img src="pics/cert1.png" alt="Certificate 1" onclick="openModal(this)" />
      <img src="pics/cert2.png" alt="Certificate 2" onclick="openModal(this)" />
      <img src="pics/cert3.png" alt="Certificate 3" onclick="openModal(this)" />
      <img src="pics/oracle.jpg" alt="Certificate 4" onclick="openModal(this)" />
      <img src="pics/databasecert.jpg" alt="Certificate 5" onclick="openModal(this)" />
      <img src="pics/mscert.jpg" alt="Certificate 5" onclick="openModal(this)" />
    </div>
  </section>

  <!-- Modal for zoom -->
  <div id="certModal" class="modal" onclick="closeModal()">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImg">
  </div>

  <!-- External Script -->
  <script src="cert.js"></script>
</body>
</html>
